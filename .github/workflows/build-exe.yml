name: Build Windows executable

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the wizard on Windows (hospital reference values)
        run: python tests/gui_smoke.py

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller==6.11.1

      - name: Build exe
        run: pyinstaller --onefile --windowed --name RT-Bunker-Shielding-Wizard shielding_wizard.py

      - name: Smoke-test the exe (must start and stay open)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\RT-Bunker-Shielding-Wizard.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { Write-Error "exe exited early with code $($p.ExitCode)"; exit 1 }
          Write-Host "exe is running (pid $($p.Id)), window title: '$($p.MainWindowTitle)'"
          Stop-Process -Id $p.Id -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RT-Bunker-Shielding-Wizard-windows
          path: dist/RT-Bunker-Shielding-Wizard.exe

      - name: Attach exe to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RT-Bunker-Shielding-Wizard.exe
