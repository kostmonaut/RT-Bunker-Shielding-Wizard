name: Build Windows executable

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller==6.11.1

      - name: Build exe
        run: pyinstaller --onefile --windowed --name RT-Bunker-Shielding-Wizard shielding_wizard.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RT-Bunker-Shielding-Wizard-windows
          path: dist/RT-Bunker-Shielding-Wizard.exe

      - name: Attach exe to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RT-Bunker-Shielding-Wizard.exe
